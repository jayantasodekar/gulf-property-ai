name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scraper tests eval

      - name: Test
        run: pytest -q

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: Fail if a secret was committed
        run: |
          if git grep -nE 'sk-or-[a-zA-Z0-9_-]{16,}' -- . ':!*.yml' ':!*.md'; then
            echo "::error::An OpenRouter key appears to be committed."
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env must never be committed."
            exit 1
          fi
          echo "no secrets found"

  frontend:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
        continue-on-error: true

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gulf-property-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 7860:7860 gulf-property-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/healthz > /tmp/health.json; then
              echo "healthy:"; cat /tmp/health.json; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:7860/healthz > /dev/null

          echo "--- container must not run as root ---"
          test "$(docker exec app id -u)" != "0"

          echo "--- search endpoint returns results ---"
          curl -fsS "http://localhost:7860/api/properties?city=Riyadh&limit=3" | head -c 300
          docker rm -f app
